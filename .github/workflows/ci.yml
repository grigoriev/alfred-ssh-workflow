name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: make lint

  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: brew install bats-core jq

      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Alfred Workflow
        run: make build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SSH.alfredworkflow
          path: SSH.alfredworkflow
